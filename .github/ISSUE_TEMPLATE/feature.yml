name: Feature request
description: Propose a focused improvement to supported behavior
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What existing behavior or simpler alternative did you evaluate?

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal uses documented Cursor Agent CLI behavior.
          required: true
        - label: This proposal does not require private endpoints or desktop-token extraction.
          required: true
